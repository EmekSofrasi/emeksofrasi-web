<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menü Güncelle | Emek Sofrası</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/emek_sofrasi_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#04210f;
    --green-2:#0a3319;
    --gold:#e0c07c;
    --gold-2:#8a6a26;
    --cream:#fdf9ef;
    --ink:#1f3d2a;
    --line:#d8cba4;
    --danger:#b23b3b;
    --ok:#2f7a4d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--green);
    color:var(--cream);
    font-family:"Mulish",system-ui,sans-serif;
    min-height:100svh;
    padding:32px 16px 80px;
  }
  h1{
    font-family:"Playfair Display",serif;
    font-size:clamp(1.5rem,1.1rem + 1.6vw,2.3rem);
    color:var(--gold);
    margin:0 0 6px;
    text-align:center;
  }
  .sub{
    text-align:center;
    color:var(--cream);
    opacity:0.75;
    margin:0 0 28px;
    font-size:0.95rem;
  }
  form{
    max-width:920px;
    margin:0 auto;
  }
  .card{
    background:var(--cream);
    color:var(--ink);
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .card h2{
    font-family:"Playfair Display",serif;
    font-size:1.15rem;
    margin:0 0 14px;
    color:var(--green-2);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .card h2 .no{
    background:var(--green);
    color:var(--gold);
    font-size:0.85rem;
    width:28px;
    height:28px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .fixed-badge{
    font-size:0.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    background:var(--gold-2);
    color:var(--cream);
    padding:3px 9px;
    border-radius:999px;
    margin-left:auto;
  }
  .fields{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
  }
  label.field-label{
    display:block;
    font-size:0.75rem;
    color:var(--gold-2);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin-bottom:4px;
  }
  input[type="text"],input[type="password"],input[type="date"]{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:8px;
    font:inherit;
    font-size:0.95rem;
    background:#fff;
    color:var(--ink);
  }
  input[type="text"]:focus,input[type="password"]:focus,input[type="date"]:focus{
    outline:2px solid var(--green-2);
    outline-offset:1px;
  }
  input[disabled]{
    background:#ece6d4;
    color:#8a8270;
  }
  .hafta-row{
    max-width:460px;
  }
  .yan-row{
    max-width:100%;
  }
  .hafta-preview{
    font-size:0.85rem;
    color:var(--green-2);
    font-weight:700;
    margin:10px 0 0;
  }
  .hint{
    font-size:0.8rem;
    color:#6b6350;
    margin-top:8px;
  }
  .food-row{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .food-input-row{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .food-input-row input{
    flex:1;
  }
  .remove-food{
    flex-shrink:0;
    background:transparent;
    border:1px solid var(--danger);
    color:var(--danger);
    border-radius:6px;
    width:32px;
    height:34px;
    font-size:1.1rem;
    line-height:1;
    padding:0;
    cursor:pointer;
  }
  .remove-food:hover{background:var(--danger);color:#fff;}
  .add-food-btn{
    margin-top:12px;
    background:transparent;
    border:1.5px dashed var(--gold-2);
    color:var(--gold-2);
    padding:8px 16px;
    border-radius:8px;
    font:inherit;
    font-weight:700;
    font-size:0.85rem;
    cursor:pointer;
  }
  .add-food-btn:hover{background:var(--gold-2);color:var(--cream);}
  .card-h2-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .remove-menu-btn{
    background:transparent;
    border:1px solid var(--danger);
    color:var(--danger);
    border-radius:6px;
    padding:4px 10px;
    font-size:0.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.02em;
    cursor:pointer;
  }
  .remove-menu-btn:hover{background:var(--danger);color:#fff;}
  .add-menu-btn{
    display:block;
    width:100%;
    max-width:920px;
    margin:4px auto 18px;
    background:transparent;
    border:2px dashed var(--gold);
    color:var(--gold);
    padding:14px;
    border-radius:14px;
    font:inherit;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
  }
  .add-menu-btn:hover{background:rgba(224,192,124,0.12);}
  .submit-card{
    text-align:center;
  }
  .submit-card input[type="password"]{
    max-width:260px;
    margin:0 auto 14px;
    display:block;
    text-align:center;
  }
  button{
    background:var(--green);
    color:var(--gold);
    border:none;
    padding:13px 34px;
    border-radius:999px;
    font:inherit;
    font-weight:700;
    font-size:1rem;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:opacity .15s;
  }
  button:hover{opacity:0.88;}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  #status{
    max-width:920px;
    margin:14px auto 0;
    padding:12px 16px;
    border-radius:10px;
    font-weight:600;
    text-align:center;
    display:none;
  }
  #status.show{display:block;}
  #status.ok{background:var(--ok);color:#fff;}
  #status.err{background:var(--danger);color:#fff;}
  #status.pending{background:var(--gold-2);color:var(--cream);}
</style>
</head>
<body>

<h1>Haftalık Menü Güncelle</h1>
<p class="sub">Bu sayfa yalnızca menü güncellemesi içindir, sitede link olarak gösterilmez.</p>

<form id="menu-form">
  <div class="card">
    <div class="fields hafta-row">
      <div>
        <label class="field-label" for="haftaBaslangic">Başlangıç Tarihi</label>
        <input type="date" id="haftaBaslangic" name="haftaBaslangic" required>
      </div>
      <div>
        <label class="field-label" for="haftaBitis">Bitiş Tarihi</label>
        <input type="date" id="haftaBitis" name="haftaBitis" required>
      </div>
    </div>
    <p class="hafta-preview" id="hafta-preview"></p>
  </div>

  <div id="menuler-wrap"></div>

  <button type="button" class="add-menu-btn" id="add-menu-btn">+ Menü Ekle</button>

  <div class="card">
    <h2>Yan Ürünler <span class="fixed-badge">Her Hafta Sabit Kalabilir</span></h2>
    <div class="fields yan-row">
      <div>
        <label class="field-label" for="yanUrunler">Yemekler (virgülle ayırın)</label>
        <input type="text" id="yanUrunler" name="yanUrunler" placeholder="Cacık, Buharda Pişmiş Sebzeler" required>
      </div>
    </div>
  </div>

  <div class="card submit-card">
    <label class="field-label" for="password">Parola</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" id="submit-btn">Menüyü Güncelle</button>
    <p class="hint">Güncelleme kaydedilince menü sayfasında hemen görünür.</p>
  </div>
</form>

<div id="status"></div>

<script src="js/menu-data.js"></script>
<script src="js/menu-config.js"></script>
<script>
(function () {
  "use strict";

  var CFG = window.MENU_CONFIG || {};
  function sbHeaders(key) {
    var h = { apikey: key };
    if (/^eyJ/.test(key)) h.Authorization = "Bearer " + key;
    return h;
  }

  var wrap = document.getElementById("menuler-wrap");
  var form = document.getElementById("menu-form");
  var statusEl = document.getElementById("status");
  var submitBtn = document.getElementById("submit-btn");

  var YEMEK_PLACEHOLDER = ["Günün Çorbası", "Ana Yemek", "Yan Ürün / Salata", "İçecek"];

  function renumber(container) {
    var labels = container.querySelectorAll(".field-label");
    for (var i = 0; i < labels.length; i++) labels[i].textContent = (i + 1) + ". Yemek";
    var removeBtns = container.querySelectorAll(".remove-food");
    for (var j = 0; j < removeBtns.length; j++) {
      removeBtns[j].style.visibility = removeBtns.length > 1 ? "visible" : "hidden";
    }
  }

  function addFoodField(container, placeholder, value) {
    var row = document.createElement("div");
    row.className = "food-row";

    var label = document.createElement("label");
    label.className = "field-label";
    label.textContent = "Yemek";
    row.appendChild(label);

    var inputRow = document.createElement("div");
    inputRow.className = "food-input-row";

    var input = document.createElement("input");
    input.type = "text";
    input.required = true;
    input.placeholder = placeholder || "Ek Yemek";
    if (value) input.value = value;
    inputRow.appendChild(input);

    var removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "remove-food";
    removeBtn.textContent = "×";
    removeBtn.title = "Bu yemeği kaldır";
    removeBtn.addEventListener("click", function () {
      if (container.querySelectorAll(".food-row").length <= 1) return;
      row.remove();
      renumber(container);
    });
    inputRow.appendChild(removeBtn);

    row.appendChild(inputRow);
    container.appendChild(row);
    renumber(container);
    return input;
  }

  function buildMenuCard(no, foodCount) {
    var card = document.createElement("div");
    card.className = "card";

    var h2 = document.createElement("h2");
    var span = document.createElement("span");
    span.className = "no";
    span.textContent = no;
    h2.appendChild(span);

    var titleText = document.createElement("span");
    titleText.className = "menu-title-text";
    titleText.textContent = "Menü " + no;
    h2.appendChild(titleText);

    var actions = document.createElement("div");
    actions.className = "card-h2-actions";
    var removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "remove-menu-btn";
    removeBtn.textContent = "Menüyü Kaldır";
    removeBtn.addEventListener("click", function () {
      if (wrap.querySelectorAll(":scope > .card").length <= 1) return;
      card.remove();
      renumberMenus();
    });
    actions.appendChild(removeBtn);
    h2.appendChild(actions);
    card.appendChild(h2);

    var fields = document.createElement("div");
    fields.className = "fields";
    fields.setAttribute("data-menu", no);
    for (var i = 0; i < (foodCount || 4); i++) {
      addFoodField(fields, YEMEK_PLACEHOLDER[i]);
    }
    card.appendChild(fields);

    var addFoodBtn = document.createElement("button");
    addFoodBtn.type = "button";
    addFoodBtn.className = "add-food-btn";
    addFoodBtn.textContent = "+ Yemek Ekle";
    addFoodBtn.addEventListener("click", function () { addFoodField(fields); });
    card.appendChild(addFoodBtn);

    return card;
  }

  function renumberMenus() {
    var cards = wrap.querySelectorAll(":scope > .card");
    cards.forEach(function (card, i) {
      var no = i + 1;
      card.querySelector(".no").textContent = no;
      card.querySelector(".menu-title-text").textContent = "Menü " + no;
      card.querySelector(".fields").setAttribute("data-menu", no);
    });
    updateFixedBadges();
  }

  function updateFixedBadges() {
    var cards = Array.prototype.slice.call(wrap.querySelectorAll(":scope > .card"));
    cards.forEach(function (card) {
      var existing = card.querySelector(".fixed-badge");
      if (existing) existing.remove();
    });
    var lastTwo = cards.slice(-2);
    lastTwo.forEach(function (card) {
      var badge = document.createElement("span");
      badge.className = "fixed-badge";
      badge.textContent = "Her Hafta Sabit Kalabilir";
      var actions = card.querySelector(".card-h2-actions");
      actions.insertBefore(badge, actions.firstChild);
    });
  }

  function addMenuCard(foodCount) {
    var no = wrap.querySelectorAll(":scope > .card").length + 1;
    wrap.appendChild(buildMenuCard(no, foodCount));
    updateFixedBadges();
  }

  var initialCount = (window.MENU_DATA && window.MENU_DATA.menuler && window.MENU_DATA.menuler.length) || 8;
  for (var m = 1; m <= initialCount; m++) {
    var staticItems = window.MENU_DATA && window.MENU_DATA.menuler && window.MENU_DATA.menuler[m - 1];
    wrap.appendChild(buildMenuCard(m, staticItems && staticItems.kalemler ? staticItems.kalemler.length : 4));
  }
  updateFixedBadges();

  document.getElementById("add-menu-btn").addEventListener("click", function () { addMenuCard(); });

  var MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function toISODate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

  function formatHaftaText(startStr, endStr) {
    if (!startStr || !endStr) return "";
    var s = new Date(startStr + "T00:00:00");
    var e = new Date(endStr + "T00:00:00");
    if (isNaN(s.getTime()) || isNaN(e.getTime())) return "";
    var sd = s.getDate(), sm = MONTHS[s.getMonth()], sy = s.getFullYear();
    var ed = e.getDate(), em = MONTHS[e.getMonth()], ey = e.getFullYear();
    if (sy !== ey) return sd + " " + sm + " " + sy + " – " + ed + " " + em + " " + ey;
    if (sm !== em) return sd + " " + sm + " – " + ed + " " + em;
    return sd + " – " + ed + " " + em;
  }

  var startInput = document.getElementById("haftaBaslangic");
  var endInput = document.getElementById("haftaBitis");
  var haftaPreview = document.getElementById("hafta-preview");

  function updateHaftaPreview() {
    var text = formatHaftaText(startInput.value, endInput.value);
    haftaPreview.textContent = text ? ("Sitede görünecek: " + text) : "";
  }
  startInput.addEventListener("change", updateHaftaPreview);
  endInput.addEventListener("change", updateHaftaPreview);

  // Varsayılan: bugünden sonraki ilk Pazartesi – Pazar (bir sonraki hafta)
  (function setDefaultDates() {
    var today = new Date();
    var day = today.getDay();
    var diffToMonday = (8 - day) % 7;
    if (diffToMonday === 0) diffToMonday = 7;
    var nextMonday = new Date(today);
    nextMonday.setDate(today.getDate() + diffToMonday);
    var nextSunday = new Date(nextMonday);
    nextSunday.setDate(nextMonday.getDate() + 6);
    startInput.value = toISODate(nextMonday);
    endInput.value = toISODate(nextSunday);
    updateHaftaPreview();
  })();

  function prefill(data) {
    if (!data) return;
    document.getElementById("yanUrunler").value = (data.yanUrunler || []).join(", ");
    (data.menuler || []).forEach(function (menu) {
      var container = document.querySelector('.fields[data-menu="' + menu.no + '"]');
      if (!container) return;
      var items = menu.kalemler || [];
      var inputs = container.querySelectorAll("input");
      // Gerekirse fazladan alan ekle (4'ten fazla yemek varsa)
      while (inputs.length < items.length) {
        addFoodField(container);
        inputs = container.querySelectorAll("input");
      }
      inputs.forEach(function (input, i) {
        if (items[i] !== undefined) input.value = items[i];
      });
    });
  }
  prefill(window.MENU_DATA);

  if (CFG.supabaseUrl && CFG.supabaseKey) {
    fetch(CFG.supabaseUrl + "/rest/v1/menu?id=eq.1&select=data", {
      headers: sbHeaders(CFG.supabaseKey),
      cache: "no-store"
    })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (rows) {
        var d = rows && rows[0] && rows[0].data;
        if (!d || !d.menuler || !d.menuler.length) return;
        wrap.innerHTML = "";
        for (var n = 1; n <= d.menuler.length; n++) wrap.appendChild(buildMenuCard(n, (d.menuler[n - 1].kalemler || []).length || 4));
        updateFixedBadges();
        prefill(d);
      })
      .catch(function () {});
  }

  function showStatus(kind, text) {
    statusEl.className = "show " + kind;
    statusEl.textContent = text;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var hafta = formatHaftaText(startInput.value, endInput.value);
    if (!hafta) {
      showStatus("err", "⚠️ Başlangıç ve bitiş tarihini seç.");
      return;
    }

    var menuler = [];
    var menuCards = wrap.querySelectorAll(":scope > .card");
    menuCards.forEach(function (card, idx) {
      var no = idx + 1;
      var inputs = card.querySelector(".fields").querySelectorAll("input");
      var kalemler = [];
      for (var i = 0; i < inputs.length; i++) {
        var v = inputs[i].value.trim();
        if (v) kalemler.push(v);
      }
      menuler.push({ no: no, kalemler: kalemler });
    });

    var yanUrunler = document.getElementById("yanUrunler").value
      .split(",")
      .map(function (s) { return s.trim(); })
      .filter(Boolean);

    for (var mi = 0; mi < menuler.length; mi++) {
      if (!menuler[mi].kalemler.length) {
        showStatus("err", "⚠️ Menü " + menuler[mi].no + " için en az 1 yemek gir (ya da menüyü kaldır).");
        return;
      }
    }
    if (!yanUrunler.length) {
      showStatus("err", "⚠️ Yan ürünler boş olamaz.");
      return;
    }

    if (!CFG.supabaseUrl || !CFG.supabaseKey) {
      showStatus("err", "⚠️ Menü veritabanı henüz bağlanmamış (menu-config.js boş).");
      return;
    }

    var password = document.getElementById("password").value;

    submitBtn.disabled = true;
    showStatus("pending", "Güncelleniyor…");

    function fail(text) {
      submitBtn.disabled = false;
      showStatus("err", "⚠️ " + text);
    }

    fetch(CFG.supabaseUrl + "/rest/v1/rpc/update_menu", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, sbHeaders(CFG.supabaseKey)),
      body: JSON.stringify({
        p_password: password,
        p_data: { hafta: hafta, menuler: menuler, yanUrunler: yanUrunler }
      })
    })
      .then(function (res) {
        if (res.ok) {
          submitBtn.disabled = false;
          showStatus("ok", "✅ Menü güncellendi. Menü sayfasını yenileyince görünür.");
          return;
        }
        return res.json().catch(function () { return {}; }).then(function (err) {
          var msg = (err && err.message) || "";
          if (msg.indexOf("wrong_password") !== -1) fail("Parola hatalı.");
          else if (msg.indexOf("invalid_data") !== -1) fail("Eksik veya hatalı veri var, alanları kontrol et.");
          else fail("Menü kaydedilemedi (" + res.status + ").");
        });
      })
      .catch(function () {
        fail("İnternet bağlantısı kurulamadı, tekrar dene.");
      });
  });
})();
</script>
</body>
</html>
